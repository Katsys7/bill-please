<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e7"><title>Design your bill · bill, please</title>
<link rel="icon" href="data:,">
<link rel="preload" href="assets/LibreBaskerville.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/DMSans.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="assets/IndieFlower.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=20261126r2"><script src="pickers.js?v=20261126r1" defer></script><script src="bill-data.js?v=20261126r1" defer></script><script src="app.js?v=20261126r2" defer></script>
</head>
<body data-page="design">
<header class="site-header"><a href="index.html">bill, please</a></header>
<main class="design-page">
<div class="design-layout">
<div class="live-column"><div class="live-stage" id="live-bill" aria-label="Bill preview" tabindex="0"></div></div>
<div class="design-controls"><h1>Design your bill</h1>
<form id="bill-form">
<div class="options-row">
<fieldset><legend>Color</legend><div class="choices papers"><label class="choice paper-choice paper-two" title="Vintage"><input type="radio" name="paper" value="vintage" aria-label="Vintage paper"><span></span></label><label class="choice paper-choice paper-one" title="Clean white"><input type="radio" name="paper" value="white" checked aria-label="Clean white restaurant paper"><span></span></label><label class="choice paper-choice paper-three" title="Pale sage recycled paper"><input type="radio" name="paper" value="mint" aria-label="Pale sage recycled paper"><span></span></label></div></fieldset>
<fieldset><legend>Style</legend><div class="choices styles"><label class="choice style-choice style-one"><input type="radio" name="style" value="perforated" checked aria-label="Perforated bill style"><span aria-hidden="true"><svg class="style-glyph" viewBox="0 0 24 24"><path d="M6 3l2 1 2-1 2 1 2-1 2 1 2-1v18l-2-1-2 1-2-1-2 1-2-1-2 1Z" fill="white" stroke="currentColor" stroke-width="1.2"/><path d="M9 8h6m-6 4h6m-6 4h4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span></label><label class="choice style-choice style-two"><input type="radio" name="style" value="coffee" aria-label="Coffee stained bill style"><span aria-hidden="true"><svg class="style-glyph coffee-glyph" viewBox="0 0 30 30"><path d="M29 5C20 1 12 7 13 15s9 14 16 10"/><path d="M28 7C21 4 15 9 16 15s6 10 12 8" opacity=".4"/><circle cx="10" cy="24" r="1"/><circle cx="12" cy="5" r=".6"/></svg></span></label><label class="choice style-choice style-three"><input type="radio" name="style" value="crumpled" aria-label="Crumpled bill style"><span aria-hidden="true"><img src="assets/crumpled-icon.png" alt=""></span></label></div></fieldset>
</div>
<div class="field"><label for="bill-title">Bill Title <span aria-hidden="true">*</span></label><input id="bill-title" name="title" maxlength="60" placeholder="Sunday, unhurried" required autocomplete="off"></div>
<button class="add-subtext" type="button" id="add-subtitle">+ Add a subtext</button>
<div class="field" id="subtitle-field" hidden><div class="field-heading"><label for="bill-subtitle">Subtext <span class="optional">(optional)</span></label></div><input id="bill-subtitle" name="subtitle" maxlength="120" autocomplete="off"></div>
<div class="field"><label for="bill-location">Location <span class="optional">(optional)</span></label><input id="bill-location" name="location" maxlength="60" autocomplete="off"></div>
<div class="two-fields"><div class="field"><label id="date-label" for="date-trigger">Date <span aria-hidden="true">*</span></label><div class="picker-wrap" id="date-picker"><input id="bill-date" name="date" type="hidden"><button id="date-trigger" class="picker-trigger" type="button" aria-labelledby="date-label date-value" aria-haspopup="dialog" aria-expanded="false" aria-controls="date-popover" aria-required="true"><span id="date-value"></span><svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16"/></svg></button><div id="date-popover" class="picker-popover date-popover" role="dialog" aria-label="Choose a date" hidden></div></div></div><div class="field"><label id="time-label" for="time-trigger">Time <span aria-hidden="true">*</span></label><div class="picker-wrap" id="time-picker"><input id="bill-time" name="time" type="hidden"><button id="time-trigger" class="picker-trigger" type="button" aria-labelledby="time-label time-value" aria-haspopup="listbox" aria-expanded="false" aria-controls="time-popover" aria-required="true"><span id="time-value"></span><svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg></button><div id="time-popover" class="picker-popover time-popover" role="listbox" aria-label="Choose a time" hidden></div></div></div></div>
<div id="item-fields"></div>
<button class="add-item" type="button" id="add-item">+ Add another little thing</button>
<div class="total-field"><label for="bill-total">TOTAL <span class="optional">(optional)</span></label><input id="bill-total" name="total" maxlength="70" placeholder="a day well spent" autocomplete="off"></div>
<div class="field note-field"><div class="field-heading"><label for="bill-note">Note <span class="optional">(optional)</span></label><span id="note-count" class="note-count" aria-live="polite">0/100</span></div><textarea id="bill-note" name="note" rows="3" placeholder="Same time next week?" maxlength="100"></textarea></div>
<div class="continue-row"><button class="pill continue" type="submit" aria-label="Create bill">Create <svg class="arrow arrow-right" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5"/></svg></button></div>
</form>
</div></div>
</main>
<footer class="site-footer">Created by <a href="https://www.instagram.com/katsyso/" target="_blank" rel="noopener noreferrer">@katsyso</a></footer>
</body></html>
